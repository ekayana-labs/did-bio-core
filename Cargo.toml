[package]
name = "did-bio-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Data model and resolution for the did:bio DID method (W3C DID 1.0), anchored on the Solana bio-did-registry"
license = "MIT"
repository = "https://github.com/ekayana-labs/did-bio-core"
documentation = "https://docs.rs/did-bio-core"
readme = "README.md"
keywords = ["did", "identity", "solana", "post-quantum", "ml-dsa"]
categories = ["cryptography", "authentication", "encoding"]
exclude = [".github/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.23"
# Whether a subject is a key (a curve point) decides between the generative
# fallback and `notFound`, so the curve check is not optional.
curve25519-dalek = { version = "5", default-features = false, features = ["alloc"] }

# feature "pda"
sha2 = { version = "0.11", optional = true }

# feature "verify" / "fips"
aws-lc-rs = { version = "1", optional = true }

[dev-dependencies]
sha2 = "0.11"

[features]
default = ["pda"]
## PDA derivation (`find_did_account_address`, `find_owned_subject`) and the
## resolution drivers that need it. Pure Rust: sha2.
pda = ["dep:sha2"]
## Signature verification (Ed25519, ML-DSA-87) via aws-lc-rs.
verify = ["dep:aws-lc-rs"]
## Same as `verify`, but binds the FIPS-validated AWS-LC crypto module.
fips = ["verify", "aws-lc-rs/fips"]

[package.metadata.docs.rs]
features = ["pda", "verify"]
